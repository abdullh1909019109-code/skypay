<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Pay | متجر شادو للألعاب</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <style>
        :root { --primary: #22c55e; --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .logo { text-align: center; font-size: 2.5rem; font-weight: bold; color: var(--primary); margin: 20px 0; text-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-google { background: white; color: #444; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-pay { background: var(--primary); color: white; font-size: 1.1rem; }
        .price-tag { color: var(--primary); font-weight: bold; font-size: 1.2rem; }
        .hidden { display: none; }
        .method-box { background: #0f172a; padding: 10px; border-radius: 8px; margin: 5px 0; border: 1px dashed var(--accent); font-family: monospace; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">SKY PAY ⚡</div>

    <!-- تسجيل الدخول -->
    <div id="login-section" class="card">
        <h2 style="text-align:center">مرحباً بك في Sky Pay</h2>
        <p style="text-align:center; color: #94a3b8;">المتجر الرسمي لخدمات الشحن في غريان</p>
        <button class="btn-google" onclick="loginWithGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20">
            الدخول عبر Google
        </button>
    </div>

    <!-- واجهة المتجر -->
    <div id="shop-section" class="hidden">
        <div class="card">
            <h3>أهلاً، <span id="user-name" style="color:var(--primary)"></span> 👋</h3>
            <p>اختر الخدمة التي تريد شحنها:</p>
            
            <select id="product-category" onchange="updateProducts()">
                <option value="">-- اختر القسم --</option>
                <option value="usdt">USDT رقمي</option>
                <option value="itunes">بطاقات iTunes (USA)</option>
                <option value="ff">جواهر فري فاير 💎</option>
                <option value="pubg">شدات ببجي موبايل 🔸</option>
            </select>

            <select id="product-list" onchange="showPrice()">
                <option value="">-- اختر المنتج --</option>
            </select>

            <div id="price-display" class="hidden" style="margin-top:15px; text-align:center;">
                <p>سعر ليبيانا: <span id="p-liby" class="price-tag"></span></p>
                <p>سعر GPay: <span id="p-gpay" class="price-tag"></span></p>
            </div>
        </div>

        <div id="payment-section" class="card hidden">
            <h3>طرق الدفع المتوفرة 💳</h3>
            <p>يرجى التحويل للرقم المناسب:</p>
            <div class="method-box">Gpay: 102040935588637</div>
            <div class="method-box">ليبيانا: 0946647327</div>
            <div class="method-box">Binance ID: 1125439748</div>
            <button class="btn-pay" onclick="sendOrder()">إرسال الطلب عبر واتساب 📥</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCVlNRBOZDTBvSnc4HEgCt9WFEvAiTJbP8",
        authDomain: "sky-pay-b0b04.firebaseapp.com",
        projectId: "sky-pay-b0b04",
        storageBucket: "sky-pay-b0b04.firebasestorage.app",
        messagingSenderId: "159800381746",
        appId: "1:159800381746:web:8204bf47e8ea16d3e3872b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const data = {
        usdt: [
            {n: "5 USDT", l: "60", g: "45"},
            {n: "10 USDT", l: "120", g: "90"},
            {n: "50 USDT", l: "600", g: "450"}
        ],
        itunes: [
            {n: "iTunes 2$", l: "23", g: "9"},
            {n: "iTunes 10$", l: "115", g: "45"},
            {n: "iTunes 100$", l: "1150", g: "450"}
        ],
        ff: [
            {n: "110 جوهرة", l: "10.7", g: "8.5"},
            {n: "572 جوهرة", l: "55", g: "44"},
            {n: "2398 جوهرة", l: "230", g: "184"}
        ],
        pubg: [
            {n: "60 UC", l: "10.2", g: "8.3"},
            {n: "660 UC", l: "110", g: "89"},
            {n: "8100 UC", l: "1340", g: "1090"}
        ]
    };

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((res) => {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('shop-section').classList.remove('hidden');
            document.getElementById('user-name').innerText = res.user.displayName;
        });
    }

    function updateProducts() {
        const cat = document.getElementById('product-category').value;
        const list = document.getElementById('product-list');
        list.innerHTML = '<option value="">-- اختر المنتج --</option>';
        if(cat) {
            data[cat].forEach((p, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.text = p.n;
                list.add(opt);
            });
        }
    }

    function showPrice() {
        const cat = document.getElementById('product-category').value;
        const idx = document.getElementById('product-list').value;
        if(idx !== "") {
            const item = data[cat][idx];
            document.getElementById('p-liby').innerText = item.l + " د.ل";
            document.getElementById('p-gpay').innerText = item.g + " د.ل";
            document.getElementById('price-display').classList.remove('hidden');
            document.getElementById('payment-section').classList.remove('hidden');
        }
    }

    function sendOrder() {
        const user = document.getElementById('user-name').innerText;
        const cat = document.getElementById('product-category').value;
        const idx = document.getElementById('product-list').value;
        const item = data[cat][idx];
        const text = `طلب شحن جديد من: ${user}%0Aالمنتج: ${item.n}%0Aسعر ليبيانا: ${item.l}%0Aسعر Gpay: ${item.g}`;
        window.location.href = `https://wa.me/218946647327?text=${text}`;
    }
</script>
</body>
</html>
