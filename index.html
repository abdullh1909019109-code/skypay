<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Pay | سكاي باي</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <style>
        :root { --sky-blue: #0ea5e9; --dark-bg: #0c4a6e; --card-bg: #f0f9ff; }
        body { background: var(--dark-bg); color: #333; font-family: sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; }
        .logo { text-align: center; color: white; font-size: 2.5rem; font-weight: bold; margin: 20px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .card { background: var(--card-bg); padding: 20px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 2px solid var(--sky-blue); }
        select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--sky-blue); box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 1.1rem; }
        .btn-google { background: white; color: #444; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-pay { background: var(--sky-blue); color: white; }
        .price-tag { color: #0369a1; font-weight: bold; font-size: 1.3rem; }
        .hidden { display: none; }
        .method-info { background: #e0f2fe; padding: 12px; border-radius: 10px; margin: 8px 0; border: 1px solid var(--sky-blue); color: #0369a1; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">SKY PAY 💎</div>

    <!-- تسجيل الدخول -->
    <div id="login-section" class="card">
        <h2 style="text-align:center; color: var(--sky-blue)">مرحباً بك</h2>
        <p style="text-align:center; color: #64748b;">سجل دخولك الآن للبدء</p>
        <button class="btn-google" onclick="loginWithGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20">
            المتابعة باستخدام Google
        </button>
    </div>

    <!-- واجهة المتجر -->
    <div id="shop-section" class="hidden">
        <div class="card">
            <h3>أهلاً بك، <span id="user-name" style="color:var(--sky-blue)"></span></h3>
            <label>اختر الخدمة:</label>
            <select id="category" onchange="updateProducts()">
                <option value="">-- اختر --</option>
                <option value="usdt">USDT</option>
                <option value="itunes">iTunes (USA)</option>
                <option value="ff">جواهر فري فاير</option>
                <option value="pubg">شدات ببجي</option>
            </select>

            <select id="products" onchange="showPrice()">
                <option value="">-- اختر المنتج --</option>
            </select>

            <div id="price-box" class="hidden" style="margin-top:20px; text-align:center;">
                <p>سعر ليبيانا: <span id="l-price" class="price-tag"></span></p>
                <p>سعر GPay: <span id="g-price" class="price-tag"></span></p>
            </div>
        </div>

        <div id="pay-box" class="card hidden">
            <h3 style="color:var(--sky-blue)">بيانات الدفع:</h3>
            <div class="method-info">Gpay: 102040935588637</div>
            <div class="method-info">LIBYANA: 0946647327</div>
            <div class="method-info">Binance: 1125439748</div>
            <button class="btn-pay" onclick="sendToWhatsApp()">إرسال الطلب عبر واتساب ✅</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCVlNRBOZDTBvSnc4HEgCt9WFEvAiTJbP8",
        authDomain: "sky-pay-b0b04.firebaseapp.com",
        projectId: "sky-pay-b0b04",
        storageBucket: "sky-pay-b0b04.firebasestorage.app",
        messagingSenderId: "159800381746",
        appId: "1:159800381746:web:8204bf47e8ea16d3e3872b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const menu = {
        usdt: [{n: "5 USDT", l: "60", g: "45"}, {n: "10 USDT", l: "120", g: "90"}, {n: "20 USDT", l: "240", g: "180"}],
        itunes: [{n: "iTunes 2$", l: "23", g: "9"}, {n: "iTunes 10$", l: "115", g: "45"}, {n: "iTunes 100$", l: "1150", g: "450"}],
        ff: [{n: "110 جواهر", l: "10.7", g: "8.5"}, {n: "572 جواهر", l: "55", g: "44"}, {n: "2398 جواهر", l: "230", g: "184"}],
        pubg: [{n: "60 UC", l: "10.2", g: "8.3"}, {n: "660 UC", l: "110", g: "89"}, {n: "8100 UC", l: "1340", g: "1090"}]
    };

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((res) => {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('shop-section').classList.remove('hidden');
            document.getElementById('user-name').innerText = res.user.displayName;
        }).catch(err => alert("حدث خطأ: " + err.message));
    }

    function updateProducts() {
        const c = document.getElementById('category').value;
        const p = document.getElementById('products');
        p.innerHTML = '<option value="">-- اختر المنتج --</option>';
        if(c) menu[c].forEach((item, i) => {
            let o = document.createElement('option');
            o.value = i; o.text = item.n; p.add(o);
        });
    }

    function showPrice() {
        const c = document.getElementById('category').value;
        const i = document.getElementById('products').value;
        if(i !== "") {
            const item = menu[c][i];
            document.getElementById('l-price').innerText = item.l + " د.ل";
            document.getElementById('g-price').innerText = item.g + " د.ل";
            document.getElementById('price-box').classList.remove('hidden');
            document.getElementById('pay-box').classList.remove('hidden');
        }
    }

    function sendToWhatsApp() {
        const user = document.getElementById('user-name').innerText;
        const c = document.getElementById('category').value;
        const i = document.getElementById('products').value;
        const item = menu[c][i];
        const msg = `طلب شحن من: ${user}%0Aالمنتج: ${item.n}%0Aالدفع المطلوب: ${item.l} (ليبيانا) أو ${item.g} (GPay)`;
        window.location.href = `https://wa.me/218946647327?text=${msg}`;
    }
</script>
</body>
</html>
