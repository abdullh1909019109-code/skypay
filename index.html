<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKY PAY | متجر الشحن الرقمي</title>
    
    <style>
        /* تصميم سينمائي فخم يناسب ذوقك */
        :root {
            --primary: #0ea5e9;
            --dark-bg: #020617;
            --glass: rgba(15, 23, 42, 0.9);
        }

        body {
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            width: 90%;
            max-width: 400px;
            padding: 40px 25px;
            border-radius: 30px;
            border: 1px solid rgba(14, 165, 233, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            text-align: center;
        }

        h1 { color: var(--primary); letter-spacing: 2px; margin-bottom: 10px; }
        p.desc { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }

        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            background: #0f172a;
            color: white;
            font-size: 18px;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4); }

        .hidden { display: none; }

        /* لوحة التحكم */
        .dashboard { text-align: right; }
        .stat-card { background: #1e293b; padding: 15px; border-radius: 15px; margin: 10px 0; border: 1px solid #334155; }
        .stat-card small { color: #94a3b8; display: block; }
        .stat-card span { font-size: 20px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- المرحلة 1: طلب الرقم -->
        <div id="step-login">
            <h1>SKY PAY</h1>
            <p class="desc">متجرك الموثوق لشحن الألعاب والخدمات الرقمية</p>
            <input type="tel" id="userPhone" placeholder="أدخل رقم هاتفك (واتساب)" value="0935588637">
            <button class="btn" onclick="requestWhatsAppOTP()">إرسال كود التحقق 💬</button>
        </div>

        <!-- المرحلة 2: التأكد من الكود -->
        <div id="step-verify" class="hidden">
            <h2>تحقق من واتسابك</h2>
            <p class="desc">أدخل الكود المكون من 4 أرقام</p>
            <input type="number" id="otpCode" placeholder="0 0 0 0">
            <button class="btn" onclick="validateOTP()">دخول للمتجر</button>
        </div>

        <!-- المرحلة 3: لوحة تحكم المستخدم -->
        <div id="step-dashboard" class="hidden dashboard">
            <h2 style="color: var(--primary);">لوحة التحكم ⚙️</h2>
            <div class="stat-card">
                <small>رصيد المحفظة الحالي</small>
                <span>0.00 LYD</span>
            </div>
            <div class="stat-card">
                <small>رقم المشترك (ID)</small>
                <span>#SKY-88637</span>
            </div>
            <p style="margin-top: 20px;">📌 <b>خدماتنا:</b></p>
            <button class="btn" style="background: #1e293b; border: 1px solid #334155; margin-bottom: 10px;">شحن فري فاير 🔥</button>
            <button class="btn" style="background: #1e293b; border: 1px solid #334155;">شحن USDT ₿</button>
            
            <button class="btn" style="background: #ef4444; margin-top: 20px;" onclick="location.reload()">خروج</button>
        </div>

    </div>

    <script>
        // بيانات الربط المأخوذة من صورتك لخدمة الواتساب
        const WA_INSTANCE = "instance17"; 
        const WA_TOKEN = "g60ik45g13vufvbc"; 
        let currentOTP = "";

        async function requestWhatsAppOTP() {
            const phone = document.getElementById('userPhone').value;
            if(phone.length < 9) return alert("يرجى إدخال رقم صحيح");

            // توليد كود التحقق
            currentOTP = Math.floor(1000 + Math.random() * 9000).toString();
            const msgBody = `كود التحقق لمتجر SKY PAY هو: ${currentOTP}`;
            
            try {
                // إرسال مباشر للواتساب عبر خدمة Ultramsg الموضحة في صورتك
                const response = await fetch(`https://api.ultramsg.com/${WA_INSTANCE}/messages/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `token=${WA_TOKEN}&to=${phone}&body=${encodeURIComponent(msgBody)}`
                });

                if(response.ok) {
                    document.getElementById('step-login').classList.add('hidden');
                    document.getElementById('step-verify').classList.remove('hidden');
                } else {
                    alert("مشكلة في الخدمة: تأكد أن هاتفك متصل بالإنترنت في Ultramsg");
                }
            } catch (e) {
                alert("خطأ في الاتصال بالبوابة");
            }
        }

        function validateOTP() {
            const enteredCode = document.getElementById('otpCode').value;
            if(enteredCode === currentOTP) {
                document.getElementById('step-verify').classList.add('hidden');
                document.getElementById('step-dashboard').classList.remove('hidden');
            } else {
                alert("الكود الذي أدخلته غير صحيح!");
            }
        }
    </script>
</body>
</html>
