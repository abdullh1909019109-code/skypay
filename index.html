    <!-- مكتبات Firebase الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>

    <style>
        :root {
            --sky-blue: #0ea5e9;
            --dark-navy: #020617;
            --luxury-gold: #d4af37;
        }

        body { 
            background: var(--dark-navy);
            background-image: radial-gradient(circle at center, #1e293b, #020617);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: white;
        }

        .card { 
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            padding: 40px; border-radius: 30px; text-align: center; 
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.3);
            width: 90%; max-width: 400px; border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .logo-box { width: 100%; margin-bottom: 25px; }
        .logo-box img { width: 100%; border-radius: 15px; box-shadow: 0 0 20px rgba(14, 165, 233, 0.2); }

        h2 { color: white; margin-bottom: 20px; font-weight: 800; letter-spacing: 1px; }

        .input-group { margin-bottom: 15px; text-align: right; }
        input { 
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #1e293b; 
            background: #0f172a; color: white; font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--sky-blue); box-shadow: 0 0 10px rgba(14, 165, 233, 0.3); }

        .btn-action { 
            background: linear-gradient(45deg, var(--sky-blue), #0284c7);
            color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; 
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-action:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4); }

        .footer { margin-top: 30px; color: #475569; font-size: 11px; letter-spacing: 1px; }
    </style>
</head>

<div class="card">
