<script>
    // الإعدادات الرسمية لمشروع سكاي باي من واقع صورتك الأخيرة
    const firebaseConfig = {
        apiKey: "AIzaSyCVlNRBOZDTBvSnc4HEgCt9WFEvAiTJbP8", 
        authDomain: "skypay-1b8a8.firebaseapp.com",
        projectId: "skypay-1b8a8",
        storageBucket: "skypay-1b8a8.firebasestorage.app",
        messagingSenderId: "546293200943", // تم التعديل بناءً على صورتك
        appId: "1:546293200943:web:8204bf47e8ea16d3e3872b" // تم التعديل بناءً على صورتك
    };

    // تشغيل Firebase
    firebase.initializeApp(firebaseConfig);

    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        // استخدام Redirect بدلاً من Popup لأنه أضمن للآيفون
        firebase.auth().signInWithRedirect(provider);
    }

    // استقبال نتيجة الدخول بعد العودة من صفحة جوجل
    firebase.auth().getRedirectResult().then((result) => {
        if (result && result.user) {
            alert("أهلاً بك يا بطل في سكاي باي: " + result.user.displayName);
        }
    }).catch((error) => {
        console.error("حدث خطأ:", error.message);
        if (error.code === 'auth/unauthorized-domain') {
            alert("تأكد من إضافة الرابط في 'النطاقات المصرح بها'");
        }
    });
</script>
